<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>회원 정보 검색 및 전체 조회 (HOMEWORK3)</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background-color: #f2f2f2; text-align: center; }
        tr:hover { background-color: #f9f9f9; }
        .color-box { display: inline-block; width: 14px; height: 14px; border: 1px solid #333; vertical-align: middle; }
    </style>
</head>
<body>
    <h1>회원 정보 검색 및 조회</h1>
    <p>검색할 항목을 선택하고 검색어를 입력하세요. (또는 전체 등록자 조회를 누르세요)</p>

    <form id="searchForm" method="get" action="http://cspro.sogang.ac.kr/~cse20221627/cgi-bin/task3_DB_display.php">
        
        <!-- 1. 키워드 검색 항목 6가지 -->
        <fieldset>
            <legend>회원 검색</legend>
            <p>
                <label>검색 항목:
                    <select name="search_type">
                        <option value="lastname">성</option>
                        <option value="firstname">이름</option>
                        <option value="both_name">성/이름 (성 AND 이름)</option>
                        <option value="user_id">아이디</option>
                        <option value="student_id">학번</option>
                        <option value="email">이메일</option>
                    </select>
                </label>
                <label>
                    <input type="text" name="search_keyword" placeholder="검색어 입력">
                </label>
                <br>
                <small style="color: gray;">
                    * '성/이름' 검색 시 <strong>성</strong>과 <strong>이름</strong> 사이에 반드시 스페이스바(공백)를 넣어주세요. (예: 김 철수, Smith John)
                </small>
            </p>
        </fieldset>

        <!-- 2. 등록 일자 조건 -->
        <fieldset>
            <legend>등록 일자 기준 검색</legend>
            <p>
                <label>특정 일자 이후 등록자: 
                    <input type="date" name="search_from_date"> 부터 등록된 회원
                </label>
            </p>
        </fieldset>

        <!-- 3. 필터 및 정렬 -->
        <fieldset>
            <legend>필터 및 정렬</legend>
            <p>
                <label>성별:
                    <input type="radio" name="search_gender" value="" checked>전체
                    <input type="radio" name="search_gender" value="male">남성
                    <input type="radio" name="search_gender" value="female">여성
                    <input type="radio" name="search_gender" value="other">기타
                </label>
            </p>
            <p>
                <label>정렬:
                    <select name="sort_order">
                        <option value="reg_desc">최근 등록순</option>
                        <option value="reg_asc">과거 등록순</option>
                        <option value="id_asc">학번 오름차순</option>
                    </select>
                </label>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="조건 검색">
            <button type="button" id="btn_show_all">전체 등록자 조회</button>
            <input type="reset" value="초기화">
        </p>
    </form>
    
    <p>
        <a href="task3_RegForm.html">신규 회원 등록 화면으로 이동</a>
    </p>

    <hr>

    <!-- AJAX 검색 결과 테이블이 렌더링될 영역 -->
    <div id="search_result_area"></div>

    <script>
        // HTML 특수문자 이스케이프 함수
        function escapeHtml(str) {
            if (str === null || str === undefined) return "";
            return $("<div>").text(String(str)).html();
        }

        // 줄바꿈(\n)을 <br>로 변환하는 함수
        function nl2br(str) {
            return escapeHtml(str).replace(/\r?\n/g, "<br>");
        }

        // AJAX 요청 및 테이블 렌더링 함수
        function requestMemberList(requestData) {
            var actionUrl = $("#searchForm").attr("action");

            $.ajax({
                url: actionUrl,
                type: "GET",
                data: requestData,
                dataType: "json",
                success: function(res) {
                    if (res.status !== "success") {
                        alert(res.message || "데이터 조회 중 오류가 발생했습니다.");
                        return;
                    }

                    var html = "";
                    html += "<h2>" + escapeHtml(res.page_title) + "</h2>";
                    html += "<p>";
                    html += "총 <strong>" + res.count + "</strong>명의 회원이 조회되었습니다.";
                    html += "</p>";

                    html += "<table>";
                    html += "<thead><tr>";
                    html += "<th>번호</th><th>아이디</th><th>성</th><th>이름</th><th>성별</th>";
                    html += "<th>학번</th><th>생년월일</th><th>전화번호</th><th>이메일</th><th>URL</th>";
                    html += "<th>색상</th><th>사진</th><th>코멘트</th><th>등록일시</th>";
                    html += "</tr></thead>";
                    html += "<tbody>";

                    if (res.data && res.data.length > 0) {
                        $.each(res.data, function(idx, row) {
                            html += "<tr>";
                            html += "<td align='center'>" + escapeHtml(row.id) + "</td>";
                            html += "<td><strong>" + escapeHtml(row.user_id) + "</strong></td>";
                            html += "<td>" + escapeHtml(row.user_lastname) + "</td>";
                            html += "<td>" + escapeHtml(row.user_firstname) + "</td>";
                            html += "<td align='center'>" + escapeHtml(row.user_gender) + "</td>";
                            html += "<td align='center'>" + (row.user_student_id ? escapeHtml(row.user_student_id) : "-") + "</td>";
                            html += "<td align='center'>" + (row.user_birthdate ? escapeHtml(row.user_birthdate) : "-") + "</td>";
                            html += "<td>" + (row.user_tel ? escapeHtml(row.user_tel) : "-") + "</td>";
                            html += "<td>" + (row.user_email ? escapeHtml(row.user_email) : "-") + "</td>";

                            // URL
                            html += "<td>";
                            if (row.user_url) {
                                html += "<a href='" + escapeHtml(row.user_url) + "' target='_blank'>링크</a>";
                            } else {
                                html += "-";
                            }
                            html += "</td>";

                            // 색상
                            html += "<td align='center'>";
                            if (row.user_color) {
                                var safeColor = escapeHtml(row.user_color);
                                html += "<span class='color-box' style='background-color: " + safeColor + ";'></span> " + safeColor;
                            } else {
                                html += "-";
                            }
                            html += "</td>";

                            // 사진 (Base64 Data URI)
                            html += "<td align='center'>";
                            if (row.user_file_data) {
                                html += "<a href='" + row.user_file_data + "' target='_blank'>";
                                html += "<img src='" + row.user_file_data + "' alt='프로필' style='width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd;'>";
                                html += "</a>";
                            } else {
                                html += "<span style='color: gray;'>없음</span>";
                            }
                            html += "</td>";

                            // 코멘트 및 등록일시
                            html += "<td>" + (row.user_comment ? nl2br(row.user_comment) : "-") + "</td>";
                            html += "<td align='center'><small>" + escapeHtml(row.reg_date) + "</small></td>";
                            html += "</tr>";
                        });
                    } else {
                        html += "<tr>";
                        html += "<td colspan='14' align='center' style='padding: 30px; color: #888;'>조건에 일치하는 등록 정보가 없습니다.</td>";
                        html += "</tr>";
                    }

                    html += "</tbody></table>";

                    $("#search_result_area").html(html);
                },
                error: function(xhr, status, error) {
                    alert("서버 통신 중 오류가 발생했습니다: " + error);
                }
            });
        }

        $(document).ready(function() {
            // 1. 조건 검색 버튼 클릭 (폼 제출 시)
            $("#searchForm").on("submit", function(e) {
                e.preventDefault();
                var formData = $(this).serialize();
                requestMemberList(formData);
            });

            // 2. 전체 등록자 조회 버튼 클릭
            $("#btn_show_all").on("click", function() {
                var sortOrder = $("select[name='sort_order']").val();
                requestMemberList({
                    show_all: "1",
                    sort_order: sortOrder
                });
            });

            // 3. 초기화 버튼 클릭 시 결과 영역도 비움
            $("#searchForm").on("reset", function() {
                $("#search_result_area").empty();
            });
        });
    </script>
</body>
</html>
