<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>사용자 등록 (HOMEWORK2)</title>
</head>
<body>
    <h1>사용자 등록</h1>

    <form method="post" action="http://cspro.sogang.ac.kr/~cse20221627/cgi-bin/db_insert.php" enctype="multipart/form-data">
        <fieldset>
            <legend>계정 정보</legend>
            <p>
                <label>아이디: 
                    <input type="text" name="user_id" required autofocus placeholder="아이디 입력">
                </label>
            </p>
            <p>
                <label>비밀번호: 
                    <input type="password" name="user_pw" required placeholder="비밀번호 입력">
                </label>
            </p>
        </fieldset>

        <fieldset>
            <legend>개인 정보</legend>
            <p>
                <label>성: <input type="text" name="user_lastname" required></label>
                <label>이름: <input type="text" name="user_firstname" required></label>
            </p>
            <p>
                <label>성별:
                    <input type="radio" name="user_gender" value="male" checked>남성
                    <input type="radio" name="user_gender" value="female">여성
                    <input type="radio" name="user_gender" value="other">기타
                </label>
            </p>
            <p>
                <label>학번: 
                    <input type="text" name="user_student_id" placeholder="예: 20221627">
                </label>
            </p>
            <p>
                <label>생년월일: 
                    <input type="date" name="user_birthdate">
                </label>
            </p>
        </fieldset>

        <fieldset>
            <legend>연락처 및 웹 정보</legend>
            <p>
                <label>전화번호: 
                    <input type="tel" name="user_tel" placeholder="(010) 0000-0000" pattern="\(\d{3}\) +\d{4}-\d{4}">
                </label>
            </p>
            <p>
                <label>이메일: 
                    <input type="email" name="user_email" placeholder="name@domain.com">
                </label>
            </p>
            <p>
                <label>URL: 
                    <input type="url" name="user_url" placeholder="http://www.domainname.com">
                </label>
            </p>
        </fieldset>

        <fieldset>
            <legend>기타 정보</legend>
            <p>
                <label>좋아하는 색깔: 
                    <input type="color" name="user_color" value="#000000">
                </label>
            </p>
            <p>
                <label>파일 업로드: 
                    <input type="file" name="user_file">
                </label>
            </p>
            <p>
                <label>코멘트:<br>
                    <textarea name="user_comment" rows="5" cols="40"></textarea>
                </label>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="등록">
            <input type="reset" value="초기화">
        </p>
    </form>
</body>
</html>
