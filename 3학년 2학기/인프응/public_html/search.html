<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>회원 정보 검색 및 전체 조회</title>
</head>
<body>
    <h1>회원 정보 검색 및 조회</h1>
    <p>검색할 항목을 선택하고 검색어를 입력하세요. (또는 전체 등록자 조회를 누르세요)</p>

    <form method="get" action="http://cspro.sogang.ac.kr/~cse20221627/cgi-bin/DB_display.php">
        
        <!-- 1. 키워드 검색 항목 6가지 -->
        <fieldset>
            <legend>회원 검색</legend>
            <p>
                <label>검색 항목:
                    <select name="search_type">
                        <option value="lastname">성</option>
                        <option value="firstname">이름</option>
                        <option value="both_name">성/이름 (성 AND 이름)</option>
                        <option value="user_id">아이디</option>
                        <option value="student_id">학번</option>
                        <option value="email">이메일</option>
                    </select>
                </label>
                <label>
                    <input type="text" name="search_keyword" placeholder="검색어 입력">
                </label>
                <br>
                <small style="color: gray;">
                    * '성/이름' 검색 시 <strong>성</strong>과 <strong>이름</strong> 사이에 반드시 스페이스바(공백)를 넣어주세요. (예: 김 철수, Smith John)
                </small>
            </p>
        </fieldset>

        <!-- 2. 등록 일자 조건 -->
        <fieldset>
            <legend>등록 일자 기준 검색</legend>
            <p>
                <label>특정 일자 이후 등록자: 
                    <input type="date" name="search_from_date"> 부터 등록된 회원
                </label>
            </p>
        </fieldset>

        <!-- 3. 필터 및 정렬 -->
        <fieldset>
            <legend>필터 및 정렬</legend>
            <p>
                <label>성별:
                    <input type="radio" name="search_gender" value="" checked>전체
                    <input type="radio" name="search_gender" value="male">남성
                    <input type="radio" name="search_gender" value="female">여성
                    <input type="radio" name="search_gender" value="other">기타
                </label>
            </p>
            <p>
                <label>정렬:
                    <select name="sort_order">
                        <option value="reg_desc">최근 등록순</option>
                        <option value="reg_asc">과거 등록순</option>
                        <option value="id_asc">학번 오름차순</option>
                    </select>
                </label>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="조건 검색">
            <button type="submit" name="show_all" value="1">전체 등록자 조회</button>
            <input type="reset" value="초기화">
        </p>
    </form>
    
    <p>
        <a href="RegForm.html">신규 회원 등록 화면으로 이동</a>
    </p>
</body>
</html>
