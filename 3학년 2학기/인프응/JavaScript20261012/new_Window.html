<HTML><HEAD>

<SCRIPT LANGUAGE="JAVASCRIPT">

function customize(form) {    
        var address = document.form1.url.value;

                + op_heigh;
        var new_win = window.open(address, "NewWindow", option );
}

function clear(form){ 
        document.form1.wid.value=""; 
        document.form1.heigh.value="";
}
