<button id="check">재고 조회</button>
<p id="stock">재고: 미조회</p>

<script>
const btn = document.querySelector("#check");
const out = document.querySelector("#stock");

btn.addEventListener("click", async () => {
  out.textContent = "조회 중...";

  try {
    const res = await fetch("/stock.php");

    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }

    const data = await res.json();
    out.textContent = "재고: " + data.stock + "개";

  } catch (err) {
    out.textContent = "조회 실패";
  }
});
</script>
